<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suporte SlowDev</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#f4f4f5; color:#18181b; }
  main { max-width:640px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  h1 { font-size:1rem; padding:16px; margin:0; border-bottom:1px solid #e4e4e7; background:#fff; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 14px; border-radius:12px; max-width:78%; white-space:pre-wrap; line-height:1.5; }
  .voce { background:#2563eb; color:#fff; align-self:flex-end; }
  .agente { background:#fff; border:1px solid #e4e4e7; align-self:flex-start; }
  .pensando { opacity:.55; font-style:italic; }
  form { display:flex; gap:8px; padding:16px; border-top:1px solid #e4e4e7; background:#fff; }
  input { flex:1; padding:11px 14px; border:1px solid #d4d4d8; border-radius:8px; font-size:1rem; }
  button { padding:11px 20px; border:0; border-radius:8px; background:#2563eb; color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Suporte SlowDev</h1>
  <div id="log"></div>
  <form id="form">
    <input id="entrada" autocomplete="off" placeholder="Digite sua duvida..." required>
    <button id="enviar" type="submit">Enviar</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const enviar = document.getElementById("enviar");
  let sessaoId = null;

  function bolha(texto, quem, extra) {
    const div = document.createElement("div");
    div.className = "msg " + quem + (extra ? " " + extra : "");
    div.textContent = texto;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;

    bolha(texto, "voce");
    entrada.value = "";
    enviar.disabled = true;
    const aguardando = bolha("consultando...", "agente", "pensando");

    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto, sessao_id: sessaoId })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const dados = await r.json();
      sessaoId = dados.sessao_id;
      aguardando.remove();
      bolha(dados.resposta, "agente");
    } catch (err) {
      aguardando.remove();
      bolha("Erro ao falar com o servidor: " + err.message, "agente");
    } finally {
      enviar.disabled = false;
      entrada.focus();
    }
  });
</script>
</body>
</html>
